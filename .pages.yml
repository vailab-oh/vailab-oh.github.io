media:
  input: public/uploads
  output: /uploads
content:
  - name: news
    label: News
    type: collection
    path: _news
    format: yaml-frontmatter
    filename:
      template: "{fields.date}-{primary}.md"
      field: false
    view:
      primary: title
      fields: [title, date, category, featured]
      sort: [date, title]
      search: [title, summary, category]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: date
        label: Date
        type: date
        required: true
        options: { format: yyyy-MM-dd }
      - { name: category, label: Category, type: string, required: true }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: featured, label: Featured on homepage, type: boolean, default: false }
      - { name: thumbnail, label: Thumbnail / featured image, type: image, required: false }
      - { name: body, label: Content, type: rich-text }
      - { name: paper_url, label: Paper URL, type: string, required: false }
      - { name: code_url, label: Code URL, type: string, required: false }
      - { name: external_url, label: External URL, type: string, required: false }
  - name: projects
    label: Projects
    type: collection
    path: _projects
    format: yaml-frontmatter
    filename: "{fields.start_year}-{primary}.md"
    view:
      primary: title
      fields: [title, group, start_year, order, period, supporting_organization]
      sort: [start_year, title]
      search: [title, research_area, supporting_organization]
      default:
        sort: start_year
        order: desc
    fields:
      - { name: title, label: Project title, type: string, required: true }
      - name: group
        label: Project group
        type: select
        required: true
        options:
          values:
            - { label: Academic Research Projects, value: academic }
            - { label: Selected R&D Projects at ADD, value: add }
      - { name: start_year, label: Start year, type: number, required: true }
      - { name: order, label: Display order within the same start year, type: number, required: false }
      - { name: period, label: Period, type: string, required: false }
      - { name: supporting_organization, label: Supporting organization, type: string, required: false }
      - { name: program, label: Program, type: string, required: false }
      - { name: collaboration, label: International collaboration, type: string, required: false }
      - { name: research_area, label: Research area, type: text, required: true }
      - { name: role, label: Role, type: string, required: false }
      - { name: related_publication_ids, label: Related publication IDs, type: string, required: false, description: "Comma-separated publication IDs from data/publications.ts" }
      - { name: body, label: Description, type: rich-text }
settings:
  content:
    merge: true
